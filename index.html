<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>秋雨</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif}
    body{
      min-height:100vh;
      position:relative;
      overflow-x:hidden;
      color:#fff;
    }
    /* 背景层+动态缤纷滤镜 */
    .bg{
      position:fixed;inset:0;
      background:url("https://p3-flow-image-sign.byteimg.com/tos-cn-i-a9rns3fr37/2a14101899994138924c17092f098373~tplv-a9rns3fr37-image.image") center/cover no-repeat;
      z-index:-2;
    }
    .bg-overlay{
      position:fixed;inset:0;
      background:linear-gradient(45deg,rgba(255,40,120,0.18),rgba(40,160,255,0.18),rgba(140,60,255,0.18));
      background-size:300% 300%;
      animation:rainbowFlow 8s ease infinite;
      z-index:-1;
    }
    @keyframes rainbowFlow{
      0%{background-position:0% 50%}
      50%{background-position:100% 50%}
      100%{background-position:0% 50%}
    }
    .container{
      max-width:900px;margin:0 auto;padding:40px 20px;
    }
    h1{
      text-align:center;font-size:60px;letter-spacing:8px;
      text-shadow:0 0 12px #4af,0 0 24px #28f;margin-bottom:24px;
    }
    .tags{
      display:flex;justify-content:center;gap:6vw;margin-bottom:48px;
      font-size:26px;font-weight:bold;
    }
    .tags span{
      text-shadow:0 0 8px #fff;
      animation:pulse 2.5s ease-in-out infinite;
    }
    .tags span:nth-child(2){animation-delay:0.4s}
    .tags span:nth-child(3){animation-delay:0.8s}
    @keyframes pulse{
      0%,100%{opacity:0.7;transform:scale(1)}
      50%{opacity:1;transform:scale(1.08)}
    }
    .card-wrap{display:flex;flex-direction:column;gap:20px}
    a.card{
      display:block;padding:28px;text-align:center;
      background:rgba(255,255,255,0.12);backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,0.2);border-radius:14px;
      text-decoration:none;color:#fff;font-size:22px;font-weight:bold;
      transition:0.3s;
    }
    a.card:hover{
      transform:translateY(-4px);
      background:rgba(255,255,255,0.2);
      box-shadow:0 8px 24px rgba(80,160,255,0.35);
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="bg-overlay"></div>
  <div class="container">
    <h1>秋雨</h1>
    <div class="tags">
      <span>良心</span>
      <span>稳定</span>
      <span>低价</span>
    </div>
    <div class="card-wrap">
      <a class="card" href="https://t.me/qiuyunb5206" target="_blank">tg通知群</a>
      <a class="card" href="https://qun.qq.com/universal-share/share?ac=1&authKey=tZsrZKJt6lx2AoEuFjQ8ElaceeAHMQMM%2B%2FMk%2B4lascWHcBs4M5g100zKzSyVPwNS&busi_data=eyJncm91cENvZGUiOiIxMDkzNTc1MTk5IiwidG9rZW4iOiJkZGdmK0ptVzN3VGh0R0RUenQvU0cyV29nUWo2dUEvd3RsYnE0aFZTTlQ5MVZ5TUN2ZklmWG5sbzJOTUJMWjBUIiwidWluIjoiMjUwOTk2OTA0MyJ9&data=bwCt7NQ_fy3XUhwuSZceDuvW4OeqlNaXqf4WrpxlKbklxkqruIWr_x9zEbRf97RgpcTh37IA1I_EoxLzT8_7DA&svctype=4&tempid=h5_group_info" target="_blank">qq通知群</a>
      <a class="card" href="https://816.jytos.cn/shop/qiuyu6" target="_blank">稳定项目提卡</a>
    </div>
  </div>
</body>
</html>
