<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>稳定 良心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", "PingFang SC", sans-serif;
        }
        body {
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            color:#fff;
        }

        /* ==========背景层 把你的图片放到这里========== */
        .bg-wrap{
            position:fixed;
            inset:0;
            z-index:-4;
        }
        .bg-img{
            width:115%;
            height:115%;
            /* ✅已加上 ./ 相对路径 */
            background: url("./bg.jpg") center / cover no-repeat;
            /* 视差动态动画 */
            animation: bgMove 14s ease-in-out infinite alternate;
            filter: blur(4px);
        }
        @keyframes bgMove {
            0%{transform: translate(-3%,-3%) scale(1.02);}
            100%{transform: translate(3%,3%) scale(1.06);}
        }
        .mask{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.58);
            z-index:-3;
        }

        /* 浮动粒子 增强动态效果 */
        .particle-container{
            position:fixed;
            inset:0;
            z-index:-2;
            overflow:hidden;
            pointer-events:none;
        }
        .particle{
            position:absolute;
            border-radius:50%;
            background:rgba(255,255,255,0.12);
            animation: float 10s linear infinite;
        }
        @keyframes float{
            0%{transform: translateY(100vh);opacity:0;}
            10%{opacity:1;}
            90%{opacity:1;}
            100%{transform: translateY(-100px);opacity:0;}
        }

        .top-space{
            height:50px;
        }
        .content{
            min-height: calc(100vh - 140px);
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            padding:20px;
        }
        .main-title{
            font-size:52px;
            font-weight:900;
            letter-spacing:10px;
            text-shadow: 0 0 12px #73c8ff, 0 0 24px #2488dd, 0 4px 10px black;
            margin-bottom:50px;
        }
        .btn-list{
            width:100%;
            max-width:350px;
            display:flex;
            flex-direction:column;
            gap:16px;
        }
        .btn{
            width:100%;
            padding:15px 20px;
            border-radius:16px;
            background:rgba(255,255,255,0.13);
            border:1px solid rgba(115,200,255,0.4);
            color:#fff;
            text-align:center;
            text-decoration:none;
            font-size:18px;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        .btn:hover{
            transform: scale(1.03);
            background:rgba(115,200,255,0.25);
            box-shadow: 0 0 20px #73c8ff60;
        }

        /* 悬浮歌词 */
        .lyric-float{
            position:fixed;
            bottom:115px;
            left:50%;
            transform: translateX(-50%);
            width:90%;
            max-width:340px;
            text-align:center;
            pointer-events:none;
            z-index:997;
        }
        .lyric-line{
            font-size:15px;
            color:rgba(255,255,255,0.4);
            line-height:26px;
            transition:0.3s;
        }
        .lyric-line.active{
            font-size:17px;
            color:#82d4ff;
            text-shadow:0 0 10px #73c8ff;
        }

        /*底部播放器*/
        .player-card{
            position:fixed;
            bottom:24px;
            left:50%;
            transform: translateX(-50%);
            width:92%;
            max-width:350px;
            background:rgba(10,14,24,0.82);
            border:1px solid #4488cc66;
            border-radius:18px;
            padding:14px;
            backdrop-filter: blur(14px);
            z-index:999;
        }
        .player-card.mini{
            width: fit-content;
        }
        .player-card.mini .player-controls{
            display:none;
        }
        .player-top{
            display:flex;
            justify-content:space-between;
            align-items:center;
        }
        .song-name{
            font-size:15px;
        }
        .mini-btn{
            border:none;
            background:rgba(255,255,255,0.1);
            color:#fff;
            width:28px;height:28px;
            border-radius:8px;
            cursor:pointer;
        }
        .player-controls{
            margin-top:10px;
            display:flex;
            gap:12px;
            align-items:center;
        }
        .play-btn{
            width:44px;height:44px;
            border-radius:50%;
            border:none;
            background:linear-gradient(135deg,#62b8ff,#3377dd);
            font-size:18px;
            cursor:pointer;
            flex-shrink:0;
        }
        .progress-wrap{
            flex:1;
        }
        input[type="range"]{
            width:100%;
            -webkit-appearance:none;
            height:4px;
            background:rgba(255,255,255,0.18);
            border-radius:3px;
        }
        input[type="range"]::-webkit-slider-thumb{
            -webkit-appearance:none;
            width:12px;height:12px;
            border-radius:50%;
            background:#73c8ff;
        }
        .time-text{
            display:flex;
            justify-content:space-between;
            font-size:11px;
            color:#aaaaaa;
            margin-top:4px;
        }
    </style>
</head>

// 生成浮动粒子，制造动态感
const particleBox = document.getElementById('particleBox');
for(let i=0;i<22;i++){
    const p = document.createElement('div');
    p.classList.add("particle");
    const size = Math.random()*6 +2;
    p.style.width = size+"px";
    p.style.height = size+"px";
    p.style.left = Math.random()*100 +"%";
    p.style.animationDelay = Math.random()*10 +"s";
    p.style.animationDuration = (8+Math.random()*8)+"s";
    particleBox.appendChild(p);
}

//播放器逻辑
const audio = document.getElementById("audioPlayer");
const playBtn = document.getElementById("playBtn");
const progressBar = document.getElementById("progressBar");
const curDom = document.getElementById("cur");
const durDom = document.getElementById("dur");
const currentLyricDom = document.getElementById("currentLyric");
const playerDom = document.getElementById("player");
const miniToggle = document.getElementById("miniToggle");

//播放暂停
playBtn.onclick = function(){
    if(audio.paused){
        audio.play().catch(e=>console.log("音频播放失败，请确认mp3文件路径正确"));
        playBtn.innerText = "⏸";
    }else{
        audio.pause();
        playBtn.innerText = "▶";
    }
}

//最小化
miniToggle.onclick = ()=>{
    playerDom.classList.toggle("mini");
    miniToggle.innerText = playerDom.classList.contains("mini") ? "+":"−";
}

//时间格式化
function fmtTime(s){
    let m = Math.floor(s/60);
    let sec = Math.floor(s%60);
    return String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0");
}

audio.addEventListener("timeupdate",()=>{
    const ct = audio.currentTime;
    const dt = audio.duration||0;
    progressBar.value = dt>0 ? (ct/dt)*100 : 0;
    curDom.innerText = fmtTime(ct);
    durDom.innerText = fmtTime(dt);
    updateLyric(ct);
})

progressBar.oninput = function(){
    if(audio.duration){
        audio.currentTime = (progressBar.value / 100) * audio.duration;
    }
}

audio.onended = function(){
    playBtn.innerText = "▶";
}

function updateLyric(currentTime){
